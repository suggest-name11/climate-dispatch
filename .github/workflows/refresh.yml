name: Refresh Climate Dispatch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch latest climate feeds
        run: node scripts/update-feeds.mjs
      - name: Save updated data.json
        run: |
          git config user.name "Dispatch Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update climate feeds"
          git push
